<!doctype html>
<html lang="en">

    <title>ZaikaHub — Order food online from restaurants near you</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--
      These tags are read BEFORE any JavaScript runs. Social scrapers
      (WhatsApp, Facebook, X, LinkedIn, Slack) never execute JS, so whatever is
      here is all they will ever see. `SeoService` then upgrades them per route
      once the app boots — this block is the floor, not the ceiling.
    -->
    <meta name="description" content="Order food online from restaurants near you. Biryani, pizza, Chinese, desserts and more, with live menus, ratings and delivery in as little as 25 minutes.">
    <meta name="theme-color" content="#dd3340">
    <link rel="canonical" href="https://zaika-hub-prod.web.app/">

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">

    <!-- Open Graph -->
    <meta property="og:site_name" content="ZaikaHub">
    <meta property="og:type" content="website">
    <meta property="og:title" content="ZaikaHub — Order food online from restaurants near you">
    <meta property="og:description" content="Order food online from restaurants near you. Biryani, pizza, Chinese, desserts and more, with live menus, ratings and delivery in as little as 25 minutes.">
    <meta property="og:url" content="https://zaika-hub-prod.web.app/">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@zaikahub">
    <meta name="twitter:title" content="ZaikaHub — Order food online from restaurants near you">
    <meta name="twitter:description" content="Order food online from restaurants near you. Biryani, pizza, Chinese, desserts and more, with live menus, ratings and delivery in as little as 25 minutes.">

    <!--
      Icon set. SVG first because it stays crisp on any display; the ICO is the
      fallback for browsers that ignore it. Browsers pick the last one they
      understand, so order matters.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">

    <!--
      Theme, decided before first paint.

      Angular cannot get here in time: injecting ThemeService from the header
      would paint the default palette first and swap it a frame later, which
      reads as a white flash on every reload. This runs synchronously while
      `index.html` is still parsing, so <html> already carries the right
      `data-theme` by the time anything is drawn.

      It is a plain inline script because it has no modules yet — and it must
      not wait for any. The value check mirrors `isThemeChoice` in
      `theme.util.ts`; anything that is not `light` or `dark` (including
      "system" and any corrupted value) removes the attribute, handing the
      decision to the stylesheet's `prefers-color-scheme` block.
    -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('zaika-hub.theme');
          var root = document.documentElement;
          if (choice === 'light' || choice === 'dark') {
            root.setAttribute('data-theme', choice);
          } else {
            root.removeAttribute('data-theme');
          }
        } catch (e) {
          /* storage blocked — the media query still picks a sane theme */
        }
      })();
    </script>

    <!--
      No `preconnect` to an image host any more: the catalogue and every owner
      upload now live on Firebase Storage, so warming a connection to Cloudinary
      cost a DNS lookup and a TLS handshake that nothing used.
    -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
