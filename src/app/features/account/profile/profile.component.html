<div class="container page">
  <h1>My profile</h1>

  <div class="page__grid">
    <section class="card block">
      <h2>Account details</h2>

      <div class="field">
        <span class="field__label">Email</span>
        <p class="value">{{ email() }}</p>
      </div>

      <div class="field">
        <span class="field__label">Account type</span>
        <p class="value">{{ roleLabel() }}</p>
      </div>

      <div class="field">
        <span class="field__label">Member since</span>
        <p class="value">{{ user()?.createdAt | date: 'mediumDate' }}</p>
      </div>
    </section>

    <section class="card block">
      <h2>Edit details</h2>

      <form [formGroup]="form" (ngSubmit)="save()" novalidate>
        <div class="field">
          <label class="field__label" for="displayName">Full name</label>
          <input id="displayName" class="input" formControlName="displayName" />
          @if (form.controls['displayName'].invalid && form.controls['displayName'].touched) {
            <span class="field__error">Please enter your name.</span>
          }
        </div>

        <div class="field">
          <label class="field__label" for="phone">Phone</label>
          <input id="phone" class="input" type="tel" formControlName="phone" />
        </div>

        <div class="actions">
          <button class="btn btn--primary" type="submit" [disabled]="saving()">
            {{ saving() ? 'Saving…' : 'Save changes' }}
          </button>
          <a class="btn btn--outline" routerLink="/account/addresses">Manage addresses</a>
        </div>
      </form>
    </section>
  </div>

  <button type="button" class="btn btn--outline signout" (click)="signOut()">Sign out</button>
</div>
